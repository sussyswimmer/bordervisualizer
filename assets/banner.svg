<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title">
  <title id="title">Rimlight: your screen, lit by your music.</title>
  <!-- Rimlight README banner and GitHub social preview (doc 08 §1), 1280x640.
       A dark screen whose rim glows violet to cyan, the light spilling inward and into the room around it,
       with the wordmark and the tagline on the screen. The glow is assets/icon.svg's recipe at banner scale:
       the same rim gradient (#7C5CFF top left to #22D3EE bottom right), a bright soft core, a halo outside,
       and the spill inside drawn twice (near and far) so it fades off the edge like the real glow.
       build/icons.sh (or icons.ps1) renders it to assets/banner.png with tools/icon-gen.

       Text: every glyph is an outline, so the file needs no font. "Rimlight" is Inter Display SemiBold at
       150 px with -0.02 em tracking on baseline y = 338; the tagline is Inter Regular at 34 px on baseline
       y = 414. Both were shaped with HarfBuzz (kerning on) and centered on x = 640 by their ink.
       Inter 4.0, copyright 2016 The Inter Project Authors (https://github.com/rsms/inter), is licensed under
       the SIL Open Font License 1.1 (https://openfontlicense.org), which allows embedding its outlines in a
       document like this one. Renaming the app means outlining the new name the same way. -->
  <defs>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="170" y1="100" x2="1110" y2="540">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="core" gradientUnits="userSpaceOnUse" x1="170" y1="100" x2="1110" y2="540">
      <stop offset="0" stop-color="#D4C8FF"/>
      <stop offset="1" stop-color="#C2F5FC"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15131E"/>
      <stop offset="1" stop-color="#0C0B12"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DEFF"/>
    </linearGradient>
    <!-- Filter regions cover the whole banner, so no blur is clipped at the default 10 % margin. -->
    <filter id="bloom" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="640">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="640">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="spill-far" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="640">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="spill-near" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="640">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="640">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <clipPath id="inside">
      <rect x="170" y="100" width="940" height="440" rx="44"/>
    </clipPath>
  </defs>
  <rect width="1280" height="640" fill="#0A0A0F"/>
  <!-- Light around the screen: a wide, faint bloom and a tighter halo. -->
  <rect x="170" y="100" width="940" height="440" rx="44" fill="none" stroke="url(#rim)" stroke-width="48" opacity="0.34" filter="url(#bloom)"/>
  <rect x="170" y="100" width="940" height="440" rx="44" fill="none" stroke="url(#rim)" stroke-width="14" opacity="0.7" filter="url(#halo)"/>
  <!-- The screen. -->
  <rect x="170" y="100" width="940" height="440" rx="44" fill="url(#screen)"/>
  <!-- Light spilling inward from the rim. -->
  <g clip-path="url(#inside)">
    <rect x="170" y="100" width="940" height="440" rx="44" fill="none" stroke="url(#rim)" stroke-width="200" opacity="0.34" filter="url(#spill-far)"/>
    <rect x="170" y="100" width="940" height="440" rx="44" fill="none" stroke="url(#rim)" stroke-width="36" opacity="0.5" filter="url(#spill-near)"/>
  </g>
  <!-- The rim, with a soft bright core. -->
  <rect x="170" y="100" width="940" height="440" rx="44" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <rect x="170" y="100" width="940" height="440" rx="44" fill="none" stroke="url(#core)" stroke-width="2.5" opacity="0.9" filter="url(#soft)"/>
